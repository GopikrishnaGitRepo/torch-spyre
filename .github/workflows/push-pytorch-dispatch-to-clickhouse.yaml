name: push-pytorch-dispatch-to-clickhouse

# Entry point for repository_dispatch events sent by pytorch/pytorch's CI
# relay (Cross-Repository CI Relay, aka CRCR). Classifies the dispatch
# (PR opened / new commit / closed / merged / push / other) and records it
# in ClickHouse. Does not trigger any build or test pipeline.
on:
  repository_dispatch:
    types: [pull_request, push]

permissions:
  contents: read

jobs:
  ingest:
    name: Classify dispatch -> ClickHouse
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_spyre_backend
    timeout-minutes: 10

    env:
      # ---------------------------------------------------------------------------
      # Set these secrets in your repo / org settings:
      #   CLICKHOUSE_HOST   e.g. clickhouse.internal.example.com
      #   CLICKHOUSE_PORT   e.g. 8123  (HTTP interface)
      #   CLICKHOUSE_USER   e.g. spyre_writer
      #   CLICKHOUSE_PASS   the password
      #   CLICKHOUSE_DB     e.g. spyre
      # ---------------------------------------------------------------------------
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

    steps:
      - name: Write dispatch payload to file
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > payload.json

      - name: Checkout (for the ingest script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/ingest_pytorch_dispatch.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup venv
        run: |
          uv venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install clickhouse-connect regex

      - name: Classify dispatch and ingest into ClickHouse
        run: |
          source .venv/bin/activate
          python3 .github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --dispatch-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summary
        if: always()
        run: |-
          {
            echo "### PyTorch Dispatch Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Dispatch type | ${{ github.event.action }} |"
            echo "| Run ID        | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
